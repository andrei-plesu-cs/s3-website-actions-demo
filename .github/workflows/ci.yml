name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name "ci" is what the ruleset's required status check refers to.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
