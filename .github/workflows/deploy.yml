name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for AWS OIDC

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Write build summary
        run: |
          {
            echo "## Build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Node | \`$(node --version)\` |"
            echo "| Commit | [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo ""
            echo "### Bundle"
            echo ""
            echo "| File | Size | Gzip |"
            echo "|---|---:|---:|"
            total=0
            total_gz=0
            while IFS= read -r f; do
              size=$(stat -c %s "$f")
              gz=$(gzip -c "$f" | wc -c)
              total=$((total + size))
              total_gz=$((total_gz + gz))
              echo "| \`${f#dist/}\` | $(numfmt --to=iec --suffix=B "$size") | $(numfmt --to=iec --suffix=B "$gz") |"
            done < <(find dist -type f | sort)
            echo "| **Total** | **$(numfmt --to=iec --suffix=B "$total")** | **$(numfmt --to=iec --suffix=B "$total_gz")** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7 # production approval may take a while

  # Staging deploys automatically. Production uses the same artifact and waits for
  # approval via the production environment's required reviewers.
  deploy-staging:
    needs: build
    uses: ./.github/workflows/deploy-s3.yml
    with:
      environment: staging

  deploy-production:
    needs: deploy-staging
    uses: ./.github/workflows/deploy-s3.yml
    with:
      environment: production
