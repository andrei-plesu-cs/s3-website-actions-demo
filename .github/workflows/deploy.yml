name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for AWS OIDC

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      # TEMP: debug OIDC trust mismatch — remove once deploy works.
      - name: Show OIDC claims
        run: |
          echo "role-to-assume: '${{ vars.AWS_ROLE_ARN }}'"
          echo "aws-region:     '${{ vars.AWS_REGION }}'"
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ("sub","aud","repository","environment","ref")}, indent=2))'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed build assets can be cached forever; everything else must revalidate.
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync remaining files
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"
